<svg xmlns="http://www.w3.org/2000/svg" width="384" height="384" viewBox="0 0 384 384">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#059669;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#047857;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.15" />
      <stop offset="50%" style="stop-color:#ffffff;stop-opacity:0" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="384" height="384" rx="69" fill="url(#bg)" />
  
  <!-- Subtle shine overlay -->
  <rect width="384" height="384" rx="69" fill="url(#shine)" />
  
  <!-- Main letter N -->
  <text x="192" y="211.32" 
        font-family="Arial, Helvetica, sans-serif" 
        font-size="161" 
        font-weight="900" 
        fill="#ffffff" 
        text-anchor="middle" 
        dominant-baseline="middle"
        letter-spacing="-4">N</text>
  
  <!-- Road line under letter -->
  <line x1="119" y1="243.52" 
        x2="265" y2="243.52" 
        stroke="#10b981" 
        stroke-width="23" 
        stroke-linecap="round" 
        opacity="0.9"/>
  
  <!-- Small dashes on road -->
  <line x1="168.64" y1="243.52" 
        x2="215.36" y2="243.52" 
        stroke="#ffffff" 
        stroke-width="9" 
        stroke-linecap="round"
        stroke-dasharray="12 8"
        opacity="0.7"/>
  
  
  <!-- "NZELA" text below road for larger icons -->
  <text x="192" y="311.92" 
        font-family="Arial, Helvetica, sans-serif" 
        font-size="38" 
        font-weight="700" 
        fill="#ffffff" 
        text-anchor="middle" 
        opacity="0.8"
        letter-spacing="8">NZELA</text>
  
</svg>