<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#059669;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#047857;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.15" />
      <stop offset="50%" style="stop-color:#ffffff;stop-opacity:0" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="92" fill="url(#bg)" />
  
  <!-- Subtle shine overlay -->
  <rect width="512" height="512" rx="92" fill="url(#shine)" />
  
  <!-- Main letter N -->
  <text x="256" y="281.8" 
        font-family="Arial, Helvetica, sans-serif" 
        font-size="215" 
        font-weight="900" 
        fill="#ffffff" 
        text-anchor="middle" 
        dominant-baseline="middle"
        letter-spacing="-5">N</text>
  
  <!-- Road line under letter -->
  <line x1="158.5" y1="324.8" 
        x2="353.5" y2="324.8" 
        stroke="#10b981" 
        stroke-width="31" 
        stroke-linecap="round" 
        opacity="0.9"/>
  
  <!-- Small dashes on road -->
  <line x1="224.8" y1="324.8" 
        x2="287.2" y2="324.8" 
        stroke="#ffffff" 
        stroke-width="12" 
        stroke-linecap="round"
        stroke-dasharray="15 10"
        opacity="0.7"/>
  
  
  <!-- "NZELA" text below road for larger icons -->
  <text x="256" y="416.6" 
        font-family="Arial, Helvetica, sans-serif" 
        font-size="51" 
        font-weight="700" 
        fill="#ffffff" 
        text-anchor="middle" 
        opacity="0.8"
        letter-spacing="10">NZELA</text>
  
</svg>