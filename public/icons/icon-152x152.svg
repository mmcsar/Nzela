<svg xmlns="http://www.w3.org/2000/svg" width="152" height="152" viewBox="0 0 152 152">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#059669;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#047857;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.15" />
      <stop offset="50%" style="stop-color:#ffffff;stop-opacity:0" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="152" height="152" rx="27" fill="url(#bg)" />
  
  <!-- Subtle shine overlay -->
  <rect width="152" height="152" rx="27" fill="url(#shine)" />
  
  <!-- Main letter N -->
  <text x="76" y="83.68" 
        font-family="Arial, Helvetica, sans-serif" 
        font-size="64" 
        font-weight="900" 
        fill="#ffffff" 
        text-anchor="middle" 
        dominant-baseline="middle"
        letter-spacing="-2">N</text>
  
  <!-- Road line under letter -->
  <line x1="47" y1="96.48" 
        x2="105" y2="96.48" 
        stroke="#10b981" 
        stroke-width="9" 
        stroke-linecap="round" 
        opacity="0.9"/>
  
  <!-- Small dashes on road -->
  <line x1="66.72" y1="96.48" 
        x2="85.28" y2="96.48" 
        stroke="#ffffff" 
        stroke-width="4" 
        stroke-linecap="round"
        stroke-dasharray="5 3"
        opacity="0.7"/>
  
  
  <!-- "NZELA" text below road for larger icons -->
  <text x="76" y="123.48" 
        font-family="Arial, Helvetica, sans-serif" 
        font-size="15" 
        font-weight="700" 
        fill="#ffffff" 
        text-anchor="middle" 
        opacity="0.8"
        letter-spacing="3">NZELA</text>
  
</svg>