<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#059669;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#047857;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.15" />
      <stop offset="50%" style="stop-color:#ffffff;stop-opacity:0" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="180" height="180" rx="32" fill="url(#bg)" />
  
  <!-- Subtle shine overlay -->
  <rect width="180" height="180" rx="32" fill="url(#shine)" />
  
  <!-- Main letter N -->
  <text x="90" y="99.12" 
        font-family="Arial, Helvetica, sans-serif" 
        font-size="76" 
        font-weight="900" 
        fill="#ffffff" 
        text-anchor="middle" 
        dominant-baseline="middle"
        letter-spacing="-2">N</text>
  
  <!-- Road line under letter -->
  <line x1="56" y1="114.32" 
        x2="124" y2="114.32" 
        stroke="#10b981" 
        stroke-width="11" 
        stroke-linecap="round" 
        opacity="0.9"/>
  
  <!-- Small dashes on road -->
  <line x1="79.12" y1="114.32" 
        x2="100.88" y2="114.32" 
        stroke="#ffffff" 
        stroke-width="4" 
        stroke-linecap="round"
        stroke-dasharray="5 4"
        opacity="0.7"/>
  
  
  <!-- "NZELA" text below road for larger icons -->
  <text x="90" y="146.72" 
        font-family="Arial, Helvetica, sans-serif" 
        font-size="18" 
        font-weight="700" 
        fill="#ffffff" 
        text-anchor="middle" 
        opacity="0.8"
        letter-spacing="4">NZELA</text>
  
</svg>