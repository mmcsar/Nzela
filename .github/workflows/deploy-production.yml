name: Deploy Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

env:
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://ci-placeholder.supabase.co' }}
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'ci-placeholder-anon-key' }}

jobs:
  deploy:
    name: Deploy to Vercel Production
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Vercel secrets
        id: vercel_secrets
        run: |
          missing=""
          [ -z "${{ secrets.VERCEL_TOKEN }}" ] && missing="VERCEL_TOKEN $missing"
          [ -z "${{ secrets.VERCEL_ORG_ID }}" ] && missing="VERCEL_ORG_ID $missing"
          [ -z "${{ secrets.VERCEL_PROJECT_ID }}" ] && missing="VERCEL_PROJECT_ID $missing"
          if [ -n "$missing" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Secrets Vercel absents ($missing). Job ignoré — déploiement via l'intégration Git Vercel si configurée."
            echo "Ajoute les secrets dans Settings → Secrets and variables → Actions (ou Environment production)."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Secrets Vercel présents."
          fi

      - name: Setup Node
        if: steps.vercel_secrets.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        if: steps.vercel_secrets.outputs.configured == 'true'
        run: npm ci

      - name: Lint
        if: steps.vercel_secrets.outputs.configured == 'true'
        run: npm run lint

      - name: Install Vercel CLI
        if: steps.vercel_secrets.outputs.configured == 'true'
        run: npm i -g vercel@latest

      - name: Pull Vercel Environment Information
        if: steps.vercel_secrets.outputs.configured == 'true'
        run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build Project Artifacts
        if: steps.vercel_secrets.outputs.configured == 'true'
        run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy to Vercel Production
        if: steps.vercel_secrets.outputs.configured == 'true'
        id: deploy
        run: |
          url="$(vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}")"
          echo "production-url=$url" >> "$GITHUB_OUTPUT"
          echo "Production URL: $url"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy skipped (Vercel secrets)
        if: steps.vercel_secrets.outputs.configured != 'true'
        run: echo "Aucun déploiement CLI — vérifie que le projet Vercel est connecté au dépôt GitHub."
