name: Deploy Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Vercel Production
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Vercel secrets
        run: |
          missing=""
          [ -z "${{ secrets.VERCEL_TOKEN }}" ] && missing="VERCEL_TOKEN $missing"
          [ -z "${{ secrets.VERCEL_ORG_ID }}" ] && missing="VERCEL_ORG_ID $missing"
          [ -z "${{ secrets.VERCEL_PROJECT_ID }}" ] && missing="VERCEL_PROJECT_ID $missing"
          if [ -n "$missing" ]; then
            echo "::error::Secrets manquants: $missing"
            echo "Ce job utilise l'environnement 'production'. Ajoute ces secrets dans:"
            echo "  - Settings > Secrets and variables > Actions (secrets du repo), OU"
            echo "  - Settings > Environments > production > Environment secrets"
            echo "Voir README section 'Secrets GitHub requis' pour où récupérer les valeurs."
            exit 1
          fi
          echo "Secrets Vercel présents."

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build Project Artifacts
        run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy to Vercel Production
        id: deploy
        run: |
          url="$(vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}")"
          echo "production-url=$url" >> "$GITHUB_OUTPUT"
          echo "Production URL: $url"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
