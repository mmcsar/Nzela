name: Rollback

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Target environment"
        required: true
        default: production
        type: choice
        options:
          - staging
          - production
      git_ref:
        description: "Git ref to redeploy (commit SHA, tag, or branch)"
        required: true
        default: main
        type: string

concurrency:
  group: rollback-${{ github.event.inputs.target }}
  cancel-in-progress: true

jobs:
  rollback:
    name: Rollback on Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: ${{ github.event.inputs.target }}

    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.git_ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      - name: Pull Vercel Environment Information
        run: |
          if [ "${{ github.event.inputs.target }}" = "production" ]; then
            vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"
          else
            vercel pull --yes --environment=preview --token="${{ secrets.VERCEL_TOKEN }}"
          fi
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build and Deploy rollback
        run: |
          if [ "${{ github.event.inputs.target }}" = "production" ]; then
            vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"
            url="$(vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}")"
          else
            vercel build --token="${{ secrets.VERCEL_TOKEN }}"
            url="$(vercel deploy --prebuilt --token="${{ secrets.VERCEL_TOKEN }}")"
          fi
          echo "Rollback deployed: $url"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
