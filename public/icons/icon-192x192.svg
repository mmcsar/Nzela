<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#059669;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#047857;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.15" />
      <stop offset="50%" style="stop-color:#ffffff;stop-opacity:0" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="192" height="192" rx="35" fill="url(#bg)" />
  
  <!-- Subtle shine overlay -->
  <rect width="192" height="192" rx="35" fill="url(#shine)" />
  
  <!-- Main letter N -->
  <text x="96" y="105.72" 
        font-family="Arial, Helvetica, sans-serif" 
        font-size="81" 
        font-weight="900" 
        fill="#ffffff" 
        text-anchor="middle" 
        dominant-baseline="middle"
        letter-spacing="-2">N</text>
  
  <!-- Road line under letter -->
  <line x1="59.5" y1="121.92" 
        x2="132.5" y2="121.92" 
        stroke="#10b981" 
        stroke-width="12" 
        stroke-linecap="round" 
        opacity="0.9"/>
  
  <!-- Small dashes on road -->
  <line x1="84.32" y1="121.92" 
        x2="107.68" y2="121.92" 
        stroke="#ffffff" 
        stroke-width="5" 
        stroke-linecap="round"
        stroke-dasharray="6 4"
        opacity="0.7"/>
  
  
  <!-- "NZELA" text below road for larger icons -->
  <text x="96" y="156.12" 
        font-family="Arial, Helvetica, sans-serif" 
        font-size="19" 
        font-weight="700" 
        fill="#ffffff" 
        text-anchor="middle" 
        opacity="0.8"
        letter-spacing="4">NZELA</text>
  
</svg>